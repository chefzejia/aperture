  "对 (2) 连续两次局部补丁失败即停下来重推演，把失败现场与日志交给冷上下文异源模型做独立根因诊断以打破同源隧道视野",
  "对 (3) 让异源模型仅基于契约与接口签名独立设计边界、并发与故障注入对抗测试矩阵，打断实现与测试的同源盲区",
  "对 (4) 异源默认只读，仅在显式授权的独立隔离 Worktree 中允许其实现与自测，完成后由主控（主力模型）反向逐行审查、复跑全仓门禁并 Squash 线性合入 main（双向互审）",
  "不把日常网页 GUI 验收交给无头 CLI，因为那是物理工具边界而非角色偏见，GUI 验收留在具备原生浏览器交互能力的主宿主内",
]

[[scenario]]
id = "milestone-integrated-tree-and-crash-recovery"
skills = ["multi-agent-collab"]
prompt = """
你是拓扑 B 的无人值守 Router，遇到两个场景：
(A) [Milestone #16] 有两个写文件正交的切片 S1（Scope: src/store/）和 S2（Scope: src/ui/），二者已在各自独立 Worktree 跑绿交卷。能否直接跳过整合分别验收，或直接逐片 Squash 到 main？
(B) 重启后你重读 docs/TASKS.md，发现 [Milestone #15] 仍为 Status: pending，但检查 main 历史发现已有带 `Milestone: #15` 验证账本的 Squash 提交。你应该重跑整个 #15 吗？
"""
criteria = [
  "对 A：写文件正交不等于组合正确，必须先在临时集成候选分支合出包含全部切片的唯一整合树（A∪B），在该整合树上跑通一次全仓门禁并由全新 Tester 完成一轮验收，再按最小可独立回滚语义单元 Squash 线性落盘 main 并核对树内容一致（不可独立回滚的合成 1 条）",
  "对 B：不重跑已合入的 #15；通过 main 历史中的 Milestone: #15 幂等标记识别出业务代码已在崩溃前落地，直接核销 docs/TASKS.md 为 verified（及同步台账）",
]
